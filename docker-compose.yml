services:
  severance:
    build: .
    image: severance:latest
    container_name: severance
    # Bound to the Mac's own loopback only -- the app is not reachable
    # from any other machine on the network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_MODEL: granite4.1:3b
      OLLAMA_FALLBACK_MODEL: llama3.2:latest
      OLLAMA_CODE_MODEL: qwen2.5-coder:3b
      OLLAMA_VISION_MODEL: granite3.2-vision
      SEVERANCE_SECRET_KEY: ${SEVERANCE_SECRET_KEY:-change-this-in-production-to-a-secure-random-token}
    volumes:
      # SQLite in WAL mode keeps -wal/-shm files beside the database, so the
      # whole directory is mounted, not just the .db file.
      - ./data:/app/data
      - ./corpus:/app/corpus
    restart: unless-stopped
